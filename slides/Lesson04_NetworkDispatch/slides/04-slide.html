le" font-family="Times New Roman" font-style="italic" font-size="56">j</text><text x="1470" y="90" text-anchor="middle" font-family="Times New Roman" font-style="italic" font-size="56">k</text><text x="440" y="105" text-anchor="middle" font-family="Times New Roman,Microsoft YaHei" font-size="44"><tspan font-style="italic">P</tspan><tspan baseline-shift="-10" font-size="32" font-style="italic">ij</tspan>，<tspan font-style="italic">Q</tspan><tspan baseline-shift="-10" font-size="32" font-style="italic">ij</tspan></text><text x="1140" y="105" text-anchor="middle" font-family="Times New Roman,Microsoft YaHei" font-size="44"><tspan font-style="italic">P</tspan><tspan baseline-shift="-10" font-size="32" font-style="italic">jk</tspan>，<tspan font-style="italic">Q</tspan><tspan baseline-shift="-10" font-size="32" font-style="italic">jk</tspan></text><rect x="560" y="300" width="480" height="80" fill="#FFF1EC" stroke="#8B1E24" stroke-width="3"/><text x="800" y="354" text-anchor="middle" font-family="Times New Roman,Microsoft YaHei" font-size="44" fill="#8B1E24" font-weight="700">负荷、光伏、储能</text><text x="440" y="220" text-anchor="middle" font-family="Times New Roman,Microsoft YaHei" font-size="44">支路阻抗 <tspan font-style="italic">r</tspan> + j<tspan font-style="italic">x</tspan></text></svg><p style="margin-top:30px">支路方向由<span class="blue">上游节点 <i>i</i> 指向下游节点 <i>j</i></span>；<i>δ</i>(<i>j</i>) 表示节点 <i>j</i> 的下游节点集合。<br><span class="blue"><i>P<sub>ij,t</sub></i>、<i>Q<sub>ij,t</sub></i></span> 表示支路首端功率；<span class="red"><i>L<sub>ij,t</sub></i> = <i>I<sub>ij,t</sub></i>²</span> 表示支路电流幅值平方。</p></div><div class="focus " data-emphasis="main">支路参考方向固定不变；当光伏倒送引起<strong>反向潮流</strong>时，<i>P<sub>ij,t</sub></i> 取负值。</div></section></body></html>
